name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: self-test (PowerShell ${{ matrix.ps }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ps: '5.1'
            shell_cmd: powershell
          - ps: '7'
            shell_cmd: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: ${{ matrix.shell_cmd }}
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run self-test
        shell: ${{ matrix.shell_cmd }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\test-cguard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse-check every script
        shell: ${{ matrix.shell_cmd }}
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Host ("FAIL " + $_.FullName)
              $errors | ForEach-Object { Write-Host ("   " + $_.Message) }
              $bad++
            } else {
              Write-Host ("ok   " + $_.Name)
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Scan must work with no side effects
        shell: ${{ matrix.shell_cmd }}
        run: |
          & .\cguard.ps1 scan -NoColor -Top 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean must refuse to delete without -Force
        shell: ${{ matrix.shell_cmd }}
        run: |
          $out = & .\cguard.ps1 clean -NoColor 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'nothing was deleted') { throw 'dry run did not refuse to delete' }
