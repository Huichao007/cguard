      - name: Installer test
        shell: pwsh
        run: |
          & .\tests\test-install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse-check every script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Host ("FAIL " + $_.FullName)
              $errors | ForEach-Object { Write-Host ("   " + $_.Message) }
              $bad++
            } else {
              Write-Host ("ok   " + $_.Name)
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Scan runs without side effects
        shell: pwsh
        run: |
          & .\cguard.ps1 scan -NoColor -Top 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean refuses to delete without -Force
        shell: pwsh
        run: |
          # *>&1 (not 2>&1): Write-Host goes to the information stream, so 2>&1
