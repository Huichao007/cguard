name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()

      - name: Self-test
        shell: powershell
        run: |
          & .\tests\test-cguard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer test
        shell: powershell
        run: |
          & .\tests\test-install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse-check every script
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Host ("FAIL " + $_.FullName)
              $errors | ForEach-Object { Write-Host ("   " + $_.Message) }
              $bad++
            } else {
              Write-Host ("ok   " + $_.Name)
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Scan runs without side effects
        shell: powershell
        run: |
          & .\cguard.ps1 scan -NoColor -Top 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean refuses to delete without -Force
        shell: powershell
        run: |
          # *>&1 (not 2>&1): Write-Host goes to the information stream, so 2>&1
          # misses it and $out would be empty even though the text is on screen.
          $out = & .\cguard.ps1 clean -NoColor *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'nothing was deleted') { throw 'dry run did not refuse to delete' }

  pwsh-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Self-test
        shell: pwsh
